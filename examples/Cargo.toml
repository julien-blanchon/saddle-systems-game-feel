[workspace]
members = [
    "support",
    "basic",
    "combo_system",
    "hitstop",
    "recipes",
    "time_scale",
    "debug_showcase",
    "recoil_3d",
    "punching",
    "comparison",
    "platformer",
    "shooter",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = "0.18"
saddle-systems-game-feel = { path = ".." }
saddle-bevy-e2e = { git = "https://github.com/julien-blanchon/saddle-bevy-e2e", features = ["json"] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
