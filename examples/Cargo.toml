[workspace]
members = [
    "support",
    "basic",
    "combo_system",
    "hitstop",
    "recipes",
    "time_scale",
    "debug_showcase",
    "recoil_3d",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = "0.18"
saddle-systems-game-feel = { path = ".." }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
